<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Snake – kača iz slik</title>
<style>
:root{--bg:#f6efe6;--panel:#fffaf3;--ink:#2a1a12;--mute:#8a6f5e;--acc:#e8532a;--acc2:#f0a82e;--line:#e6d6c4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#140d0a;--panel:#20140f;--ink:#fbeee0;--mute:#b79880;--line:#3a261c}}
:root[data-theme="dark"]{--bg:#140d0a;--panel:#20140f;--ink:#fbeee0;--mute:#b79880;--line:#3a261c}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px;overflow:hidden;touch-action:none;user-select:none}
header{display:flex;gap:10px;align-items:stretch;width:var(--w,560px);max-width:100%}
.stat{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 12px}
.stat small{display:block;color:var(--mute);font-size:12px}
.stat b{font-size:22px;font-variant-numeric:tabular-nums}
.stat.big b{background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
#wrap{position:relative;border-radius:18px;box-shadow:0 20px 60px -20px rgba(232,83,42,.55);overflow:hidden}
canvas{display:block}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(20,10,6,.74);backdrop-filter:blur(5px);color:#fbeee0;text-align:center;padding:20px}
#ov.hide{display:none}
#ov h1{margin:0;font-size:clamp(28px,6vw,44px);letter-spacing:-.5px}
#ov p{margin:0;color:#d9bfa8;max-width:34ch;line-height:1.45}
.seg{display:flex;gap:6px}
.seg button,.btn{font:inherit;border:1px solid #6b4430;background:transparent;color:#fbeee0;padding:8px 14px;border-radius:10px;cursor:pointer}
.seg button.on{background:#fbeee0;color:#2a1a12;border-color:#fbeee0}
.btn{background:linear-gradient(135deg,var(--acc),var(--acc2));border:0;color:#2a1000;font-weight:700;font-size:17px;padding:12px 30px;border-radius:999px}
button:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
label{display:flex;gap:8px;align-items:center;font-size:14px;color:#d9bfa8;cursor:pointer}
footer{color:var(--mute);font-size:13px;text-align:center}
</style>
</head>
<body>
<header id="hd">
  <div class="stat big"><small>Točke</small><b id="sc">0</b></div>
  <div class="stat"><small>Dolžina</small><b id="ln">3</b></div>
  <div class="stat"><small>Nivo</small><b id="lv">1</b></div>
  <div class="stat"><small>Rekord</small><b id="bs">0</b></div>
</header>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="ov">
    <h1 id="t">Snake</h1>
    <p id="m">Vsak kos hrane doda kači eno novo sliko. Pobiraj modre bonuse za +50!</p>
    <div class="seg" id="dif"><button data-s="150">Lahko</button><button data-s="115" class="on">Srednje</button><button data-s="85">Težko</button></div>
    <label><input type="checkbox" id="wr"> Skozi stene</label>
    <button class="btn" id="go">Igraj</button>
  </div>
</div>
<footer>Puščice / WASD · presledek = pavza · na telefonu povleci s prstom</footer>

function beep(f,d,type='sine',v=.07,f2){
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
  const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,actx.currentTime+d);
  g.gain.setValueAtTime(v,actx.currentTime);g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+d);
  o.connect(g).connect(actx.destination);o.start();o.stop(actx.currentTime+d)}catch(e){}
}

function resize(){
  dpr=window.devicePixelRatio||1;
  const avail=Math.min(window.innerWidth-24,window.innerHeight-170,640);
  cell=Math.max(12,Math.floor(avail/G));size=cell*G;
  cv.width=size*dpr;cv.height=size*dpr;cv.style.width=cv.style.height=size+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  document.documentElement.style.setProperty('--w',size+'px');
}
addEventListener('resize',resize);resize();

function reset(){
  const m=G>>1;
  snake=[{x:m,y:m},{x:m-1,y:m},{x:m-2,y:m}];prev=snake.map(s=>({...s}));
  dir={x:1,y:0};queue=[];score=0;level=1;eaten=0;bonus=null;particles=[];over=false;paused=false;
  stepMs=base;spawnFood();hud();
}
function hud(){$('sc').textContent=score;$('ln').textContent=snake.length;$('lv').textContent=level;$('bs').textContent=best}
function free(){
  let p;do{p={x:Math.random()*G|0,y:Math.random()*G|0}}while(snake.some(s=>s.x===p.x&&s.y===p.y)||(food&&food.x===p.x&&food.y===p.y)||(bonus&&bonus.x===p.x&&bonus.y===p.y));
  return p;
}
function spawnFood(){food=free()}

function burst(gx,gy,color,n=22){
  for(let i=0;i<n;i++){const a=Math.random()*6.283,v=1+Math.random()*3.2;
    particles.push({x:(gx+.5)*cell,y:(gy+.5)*cell,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,c:color,r:1.5+Math.random()*3})}
}

function tick(){
  if(queue.length)dir=queue.shift();
  const old=snake.map(s=>({...s}));
  let h={x:old[0].x+dir.x,y:old[0].y+dir.y};
  if(wrap){h.x=(h.x+G)%G;h.y=(h.y+G)%G}
  else if(h.x<0||h.y<0||h.x>=G||h.y>=G)return die();
  const ate=h.x===food.x&&h.y===food.y;
  const body=ate?old:old.slice(0,-1);
  if(body.some(s=>s.x===h.x&&s.y===h.y))return die();
  snake.unshift(h);
  if(!ate)snake.pop();
  prev=old.concat(ate?[old[old.length-1]]:[]);
  if(ate){
    eaten++;score+=10*level;burst(h.x,h.y,'#ffb23e');beep(520,.12,'triangle',.09,880);flash=1;
    if(eaten%5===0){level++;stepMs=Math.max(55,base-(level-1)*9);beep(660,.3,'square',.05,1200)}
    spawnFood();
    if(eaten%4===0&&!bonus){bonus={...free(),t:7000}}
  }
  if(bonus&&h.x===bonus.x&&h.y===bonus.y){score+=50;burst(h.x,h.y,'#5be0ff',34);beep(900,.25,'sine',.09,1500);bonus=null}
  if(score>best){best=score;try{localStorage.setItem('snake-best',best)}catch(e){}}
  hud();
}
function die(){
  over=true;running=false;shake=1;beep(220,.5,'sawtooth',.08,60);
  for(const s of snake)burst(s.x,s.y,'#e8532a',4);
  setTimeout(()=>{$('t').textContent='Konec igre';
    $('m').textContent=`Točke: ${score} · dolžina: ${snake.length} slik`+(score&&score>=best?' · nov rekord!':'');
    $('go').textContent='Še enkrat';ov.classList.remove('hide')},650);
}

function start(){reset();running=true;ov.classList.add('hide');lastTick=performance.now();beep(440,.15,'triangle',.07,660)}
$('go').onclick=start;
$('wr').onchange=e=>wrap=e.target.checked;
$('dif').onclick=e=>{const b=e.target.closest('button');if(!b)return;
  [...$('dif').children].forEach(x=>x.classList.toggle('on',x===b));base=+b.dataset.s};

function turn(x,y){
  if(!running||paused)return;
  const last=queue.length?queue[queue.length-1]:dir;
  if((last.x===-x&&last.y===-y)||(last.x===x&&last.y===y)||queue.length>2)return;
  queue.push({x,y});
}
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase(),M={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]};
  if(M[k]){turn(...M[k]);e.preventDefault()}
  else if(k===' '){e.preventDefault();if(running){paused=!paused;lastTick=performance.now();
    $('t').textContent='Pavza';$('m').textContent='Pritisni presledek za nadaljevanje.';$('go').textContent='Nadaljuj';
    ov.classList.toggle('hide',!paused)}}
  else if(k==='enter'&&!running&&!ov.classList.contains('hide'))start();
});
$('go').addEventListener('click',()=>{if(paused){paused=false;lastTick=performance.now();ov.classList.add('hide')}});
let t0=null;
cv.addEventListener('touchstart',e=>{t0=e.touches[0]},{passive:true});
cv.addEventListener('touchend',e=>{if(!t0)return;const t=e.changedTouches[0],dx=t.clientX-t0.clientX,dy=t.clientY-t0.clientY;
  if(Math.max(Math.abs(dx),Math.abs(dy))>16)Math.abs(dx)>Math.abs(dy)?turn(Math.sign(dx),0):turn(0,Math.sign(dy));t0=null});

// --- risanje ---
function lerpPos(a,b,t){
  if(Math.abs(a.x-b.x)>1.5||Math.abs(a.y-b.y)>1.5)return b;
  return{x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t};
}
function drawBoard(now){
  const g=ctx.createLinearGradient(0,0,size,size);g.addColorStop(0,'#1a0f0b');g.addColorStop(1,'#2a1610');
  ctx.fillStyle=g;ctx.fillRect(0,0,size,size);
  for(let y=0;y<G;y++)for(let x=0;x<G;x++)if((x+y)&1){ctx.fillStyle='rgba(255,170,70,.045)';ctx.fillRect(x*cell,y*cell,cell,cell)}
  ctx.lineWidth=4;ctx.strokeStyle=wrap?'rgba(91,224,255,.35)':'rgba(232,83,42,.65)';
  if(wrap)ctx.setLineDash([10,8]);ctx.strokeRect(2,2,size-4,size-4);ctx.setLineDash([]);
  if(flash>0){ctx.fillStyle=`rgba(255,178,62,${flash*.12})`;ctx.fillRect(0,0,size,size)}
}
function orb(px,py,r,c1,c2,now){
  const p=1+Math.sin(now/180)*.1;
  const g=ctx.createRadialGradient(px,py,0,px,py,r*2.4*p);g.addColorStop(0,c1+'aa');g.addColorStop(1,c1+'00');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(px,py,r*2.4*p,0,6.283);ctx.fill();
  const b=ctx.createRadialGradient(px-r*.3,py-r*.3,0,px,py,r*p);b.addColorStop(0,'#fff');b.addColorStop(.25,c1);b.addColorStop(1,c2);
  ctx.fillStyle=b;ctx.beginPath();ctx.arc(px,py,r*p,0,6.283);ctx.fill();
}
function drawSnake(t){
  const n=snake.length;
  for(let i=n-1;i>=0;i--){
    const a=lerpPos(prev[i]||snake[i],snake[i],t);
    let ang;
    if(i===0)ang=Math.atan2(dir.y,dir.x);
    else{const nx=lerpPos(prev[i-1]||snake[i-1],snake[i-1],t);
      let dx=nx.x-a.x,dy=nx.y-a.y;if(Math.abs(dx)>1.5)dx=-dx;if(Math.abs(dy)>1.5)dy=-dy;
      ang=dx||dy?Math.atan2(dy,dx):0}
    const sc=Math.max(.72,1.16-.4*i/Math.max(n,8));
    const px=(a.x+.5)*cell,py=(a.y+.5)*cell,s=cell*sc;
    ctx.save();ctx.translate(px,py);ctx.rotate(ang);
    if(i===0){ctx.shadowColor='#ff8a2a';ctx.shadowBlur=cell*.9}
    ctx.globalAlpha=over?.6:1;
    if(sprite)ctx.drawImage(sprite,-s/2,-s/2,s,s);
    else{ctx.fillStyle='#e8532a';ctx.beginPath();ctx.arc(0,0,s/2,0,6.283);ctx.fill()}
    ctx.restore();
  }
}
let last=performance.now();
function frame(now){
  const dt=Math.min(50,now-last);last=now;
  if(running&&!paused){
    while(now-lastTick>=stepMs&&running){lastTick+=stepMs;tick()}
    if(bonus){bonus.t-=dt;if(bonus.t<=0)bonus=null}
  }
  if(!snake)reset();
  const t=running&&!paused?Math.min(1,(now-lastTick)/stepMs):(running?1:1);
  ctx.save();
  if(shake>0){ctx.translate((Math.random()-.5)*shake*14,(Math.random()-.5)*shake*14);shake=Math.max(0,shake-dt/500)}
  drawBoard(now);flash=Math.max(0,flash-dt/300);
  orb((food.x+.5)*cell,(food.y+.5)*cell,cell*.3,'#ffc23e','#e8532a',now);
  if(bonus){const px=(bonus.x+.5)*cell,py=(bonus.y+.5)*cell;orb(px,py,cell*.32,'#5be0ff','#2a6cff',now);
    ctx.strokeStyle='#5be0ff';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(px,py,cell*.52,-1.57,-1.57+6.283*bonus.t/7000);ctx.stroke()}
  drawSnake(t);
  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vx*=.96;p.vy*=.96;p.life-=dt/600;
    if(p.life<=0){particles.splice(i,1);continue}
    ctx.globalAlpha=p.life;ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r*p.life,0,6.283);ctx.fill()}
  ctx.globalAlpha=1;ctx.restore();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
