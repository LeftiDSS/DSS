<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Snake multiplayer</title>
<style>
:root{--bg:#f6efe6;--panel:#fffaf3;--ink:#2a1a12;--mute:#8a6f5e;--acc:#e8532a;--acc2:#f0a82e;--line:#e6d6c4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#140d0a;--panel:#20140f;--ink:#fbeee0;--mute:#b79880;--line:#3a261c}}
:root[data-theme="dark"]{--bg:#140d0a;--panel:#20140f;--ink:#fbeee0;--mute:#b79880;--line:#3a261c}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;gap:12px;touch-action:manipulation;user-select:none}
#lobby{width:min(520px,100%);display:flex;flex-direction:column;gap:12px}
h1{margin:0;font-size:clamp(26px,6vw,38px);letter-spacing:-.5px}
h2{margin:0 0 8px;font-size:17px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card.col{flex-direction:column;align-items:stretch}
input[type=text]{flex:1;min-width:0;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer}
.btn{border:0;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#2a1000;font-weight:700;padding:10px 20px;border-radius:999px}
.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);padding:8px 14px;border-radius:10px}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
.room{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.room:first-child{border-top:0}.room div{flex:1;min-width:0}.room b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.room small,#hint,.mute{color:var(--mute);font-size:13px}
#game{display:flex;flex-direction:column;align-items:center;gap:10px;width:var(--w,520px);max-width:100%}
#sb{display:flex;gap:8px;width:100%;flex-wrap:wrap}
.pill{flex:1;min-width:110px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 10px;display:flex;gap:8px;align-items:center;font-size:14px}
.pill i{width:12px;height:12px;border-radius:50%;flex:none}.pill b{margin-left:auto;font-variant-numeric:tabular-nums}.pill.dead{opacity:.45}
#wrap{position:relative;border-radius:18px;overflow:hidden;box-shadow:0 20px 60px -20px rgba(232,83,42,.55)}
canvas{display:block}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(20,10,6,.72);backdrop-filter:blur(4px);color:#fbeee0;text-align:center;padding:16px}
#ov p{margin:0;color:#e2c8b2;line-height:1.5}
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));background:#2a1a12;color:#fbeee0;padding:10px 16px;border-radius:12px;font-size:14px}
</style>
</head>
<body>
<main id="lobby">
  <h1>Snake multiplayer</h1>
  <div class="card"><input type="text" id="nm" placeholder="Tvoje ime" maxlength="12" aria-label="Ime"></div>
  <div class="card"><input type="text" id="rn" placeholder="Ime nove sobe" maxlength="22" aria-label="Ime sobe"><button class="btn" id="mk">Ustvari sobo</button></div>
  <div class="card col"><h2>Odprte sobe</h2><div id="rl"></div></div>
  <p id="hint" class="mute">Povezujem se …</p>
</main>
<section id="game" hidden>
  <div id="sb"></div>
  <div id="wrap"><canvas id="c"></canvas>
    <div id="ov"><h2 id="t" style="font-size:28px;margin:0"></h2><p id="m"></p><button class="btn" id="go" hidden>Začni igro</button></div>
  </div>
  <button class="ghost" id="lv">Zapusti sobo</button>
</section>
<div id="toast" hidden></div>

<script type="module">
import {joinRoom} from 'https://cdn.jsdelivr.net/npm/trystero@0.26.0/+esm';
const APP='snake-logo-mp-v1',G=22,MAX=4,STEP=115;
const COL=['#ff8a2a','#35c8ff','#7dff6a','#ff5fd2'],HUE=[0,180,100,290];
const SP=[{x:6,y:4,dx:1,dy:0},{x:15,y:17,dx:-1,dy:0},{x:4,y:12,dx:0,dy:1},{x:17,y:9,dx:0,dy:-1}];
const $=id=>document.getElementById(id);
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){}};
const rnd=n=>Math.random()*n|0;
$('nm').value=ls('snake-name')||'Igralec'+(100+rnd(900));
const myName=()=>($('nm').value.trim()||'Igralec').slice(0,12);
function toast(s){const t=$('toast');t.textContent=s;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,3500)}

// ---- sprite (brez belega ozadja, 4 barvni odtenki) ----
let sprites=null;
const img=new Image();
img.onload=()=>{const s=160,o=document.createElement('canvas');o.width=o.height=s;const x=o.getContext('2d');x.drawImage(img,0,0,s,s);
  const d=x.getImageData(0,0,s,s),p=d.data;
  for(let i=0;i<p.length;i+=4){const m=Math.min(p[i],p[i+1],p[i+2]);p[i+3]=Math.max(0,Math.min(255,(248-m)*255/30))}
  x.putImageData(d,0,0);
  sprites=HUE.map(h=>{const c=document.createElement('canvas');c.width=c.height=s;const k=c.getContext('2d');k.filter=`hue-rotate(${h}deg)`;k.drawImage(o,0,0);return c});
};

  const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;if(f2)o.frequency.exponentialRampToValueAtTime(f2,actx.currentTime+d);
  g.gain.setValueAtTime(v,actx.currentTime);g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+d);o.connect(g).connect(actx.destination);o.start();o.stop(actx.currentTime+d)}catch(e){}}

// ---- LOBBY ----
const lobby=joinRoom({appId:APP},'lobby');
const [sendAd,getAd]=lobby.makeAction('rooms');
const rooms=new Map();
getAd((r,pid)=>rooms.set(r.id,{...r,pid,seen:Date.now()}));
lobby.onPeerLeave(pid=>{for(const [k,r] of rooms)if(r.pid===pid)rooms.delete(k)});
let hosting=null; // {id,name}
lobby.onPeerJoin(pid=>{if(hosting)sendAd(ad(),pid)});
const ad=()=>({id:hosting.id,name:hosting.name,host:myName(),n:Object.keys(H.players).length,max:MAX,st:H.st});
setInterval(()=>{if(hosting)sendAd(ad())},2000);
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function renderRooms(){
  for(const [k,r] of rooms)if(Date.now()-r.seen>7000)rooms.delete(k);
  const peers=Object.keys(lobby.getPeers()).length;
  $('hint').textContent=peers?`V lobbyju je ${peers+1} igralcev. Nove sobe se pojavijo v nekaj sekundah.`:'Iščem druge igralce … (lahko traja nekaj sekund)';
  const l=[...rooms.values()];
  $('rl').innerHTML=l.length?'':'<span class="mute">Še ni odprtih sob. Ustvari prvo!</span>';
  l.forEach(r=>{const full=r.n>=r.max,div=document.createElement('div');div.className='room';
    div.innerHTML=`<div><b>${esc(r.name)}</b><small>gostitelj: ${esc(r.host)} · ${r.n}/${r.max} · ${r.st==='play'?'igra teče':'čaka'}</small></div>`;
    const b=document.createElement('button');b.className='btn';b.textContent=full?'Polna':'Pridruži se';b.disabled=full;b.onclick=()=>joinAsGuest(r);div.appendChild(b);$('rl').appendChild(div)});
}
setInterval(renderRooms,1000);renderRooms();

// ---- skupno stanje za prikaz ----
let net=null,room=null,role=null,mySlot=null,hostId=null,cur=null,prevB={},recv=0,tickIv=null,guestTimer=null,game2=null;
let H={players:{},foods:[],st:'wait',cd:0,cdT:0,msg:'',ev:[],n0:0};
const cv=$('c'),ctx=cv.getContext('2d');let size,cell,dpr;
function resize(){dpr=devicePixelRatio||1;const a=Math.min(innerWidth-24,innerHeight-190,620);cell=Math.max(12,Math.floor(a/G));size=cell*G;
  cv.width=cv.height=size*dpr;cv.style.width=cv.style.height=size+'px';ctx.setTransform(dpr,0,0,dpr,0,0);document.documentElement.style.setProperty('--w',size+'px')}
addEventListener('resize',resize);

function setupNet(id){
  room=joinRoom({appId:APP},'g'+id);
  const a={};[a.hello,a.gHello]=room.makeAction('hello');[a.wel,a.gWel]=room.makeAction('welcome');
  [a.dir,a.gDir]=room.makeAction('dir');[a.st,a.gSt]=room.makeAction('state');return a;
}
function showGame(){$('lobby').hidden=true;$('game').hidden=false;resize();game2=true}

// ---- GOSTITELJ ----
$('mk').onclick=()=>{
  ls('snake-name',myName());
  const id=Math.random().toString(36).slice(2,8),name=$('rn').value.trim()||myName()+'-ova soba';
  hosting={id,name};role='host';net=setupNet(id);
  H={players:{},foods:[],st:'wait',cd:0,cdT:0,msg:'',ev:[],n0:0};
  mySlot=0;H.players[0]={id:'me',name:myName(),score:0,alive:false,body:[],dir:{x:1,y:0},q:[]};
  net.gHello((d,pid)=>{
    if(Object.values(H.players).some(p=>p.id===pid))return;
    let s=[0,1,2,3].find(i=>!H.players[i]);
    if(s===undefined){net.wel({ok:0},pid);return}
    H.players[s]={id:pid,name:String(d.n||'Igralec').slice(0,12),score:0,alive:false,body:[],dir:{x:1,y:0},q:[]};
    net.wel({ok:1,slot:s},pid);
  });
  net.gDir((d,pid)=>{const s=Object.keys(H.players).find(k=>H.players[k].id===pid);if(s!==undefined)pushDir(s,d.x,d.y)});
  room.onPeerLeave(pid=>{const s=Object.keys(H.players).find(k=>H.players[k].id===pid);if(s!==undefined){toast(H.players[s].name+' je odšel');delete H.players[s]}});
  showGame();tickIv=setInterval(hostTick,STEP);hostTick();
};
function pushDir(s,x,y){const p=H.players[s];if(!p||!p.alive||H.st!=='play')return;
  const l=p.q.length?p.q[p.q.length-1]:p.dir;if((l.x===-x&&l.y===-y)||(l.x===x&&l.y===y)||p.q.length>2)return;p.q.push({x,y})}
function spawnFood(){let p;do{p={x:rnd(G),y:rnd(G)}}while(Object.values(H.players).some(q=>q.body.some(c=>c.x===p.x&&c.y===p.y))||H.foods.some(f=>f.x===p.x&&f.y===p.y));H.foods.push(p)}
function startRound(){
  const ks=Object.keys(H.players);H.n0=ks.length;
  ks.forEach(s=>{const p=H.players[s],sp=SP[s];p.alive=true;p.dir={x:sp.dx,y:sp.dy};p.q=[];
    p.body=[0,1,2].map(i=>({x:(sp.x-sp.dx*i+G)%G,y:(sp.y-sp.dy*i+G)%G}))});
  H.foods=[];spawnFood();spawnFood();H.st='count';H.cdT=3000;H.cd=3;H.msg='';
}
function step(){
  const ps=Object.values(H.players).filter(p=>p.alive),occ=new Set(),k=(x,y)=>x+','+y;
  ps.forEach(p=>{if(p.q.length)p.dir=p.q.shift();p.nh={x:(p.body[0].x+p.dir.x+G)%G,y:(p.body[0].y+p.dir.y+G)%G};
    p.ate=H.foods.some(f=>f.x===p.nh.x&&f.y===p.nh.y)});
  ps.forEach(p=>(p.ate?p.body:p.body.slice(0,-1)).forEach(c=>occ.add(k(c.x,c.y))));
  ps.forEach(p=>p.dead=occ.has(k(p.nh.x,p.nh.y))||ps.some(o=>o!==p&&o.nh.x===p.nh.x&&o.nh.y===p.nh.y));
  ps.forEach(p=>{
    if(p.dead){p.alive=false;H.ev.push([p.body[0].x,p.body[0].y,2]);p.body=[];return}
    p.body.unshift(p.nh);
    if(p.ate){p.score+=10;H.ev.push([p.nh.x,p.nh.y,1]);H.foods.splice(H.foods.findIndex(f=>f.x===p.nh.x&&f.y===p.nh.y),1)}else p.body.pop();
  });
  while(H.foods.length<2)spawnFood();
  const al=Object.values(H.players).filter(p=>p.alive);
  if(al.length<=(H.n0>1?1:0)){H.st='end';
    if(H.n0>1&&al[0]){al[0].score+=50;H.msg=al[0].name+' zmaga! (+50)'}else H.msg=H.n0>1?'Neodločeno!':'Konec igre'}
}
function hostTick(){
  if(H.st==='count'){H.cdT-=STEP;H.cd=Math.max(1,Math.ceil(H.cdT/1000));if(H.cdT<=0)H.st='play'}
  else if(H.st==='play')step();
  const s={st:H.st,cd:H.cd,msg:H.msg,f:H.foods.flatMap(f=>[f.x,f.y]),ev:H.ev.splice(0),
    pl:Object.entries(H.players).map(([s,p])=>({s:+s,n:p.name,sc:p.score,a:p.alive?1:0,b:p.body.flatMap(c=>[c.x,c.y])}))};
  applyState(s);net.st(s);
}
$('go').onclick=()=>{if(role==='host'&&(H.st==='wait'||H.st==='end'))startRound()};

// ---- GOST ----
function joinAsGuest(r){
  ls('snake-name',myName());role='guest';mySlot=null;net=setupNet(r.id);
  room.onPeerJoin(pid=>net.hello({n:myName()},pid));
  net.gWel((d,pid)=>{clearTimeout(guestTimer);if(!d.ok){toast('Soba je polna');exitGame();return}mySlot=d.slot;hostId=pid;showGame()});
  net.gSt((s,pid)=>{if(pid===hostId)applyState(s)});
  room.onPeerLeave(pid=>{if(pid===hostId){toast('Gostitelj je zapustil sobo');exitGame()}});
  toast('Povezujem se v sobo …');
  guestTimer=setTimeout(()=>{if(mySlot===null){toast('Povezava ni uspela. Poskusi znova.');exitGame()}},12000);
}
function sendMyDir(x,y){if(role==='host')pushDir(mySlot,x,y);else if(hostId)net.dir({x,y},hostId)}
function exitGame(){
  clearInterval(tickIv);clearTimeout(guestTimer);try{room&&room.leave()}catch(e){}
  hosting=null;role=null;room=null;net=null;cur=null;prevB={};hostId=null;mySlot=null;game2=null;particles=[];
  $('game').hidden=true;$('lobby').hidden=false;
}
$('lv').onclick=exitGame;

// ---- prikaz stanja ----
let particles=[];
function burst(gx,gy,c,n){for(let i=0;i<n;i++){const a=Math.random()*6.283,v=1+Math.random()*3;particles.push({x:(gx+.5)*cell,y:(gy+.5)*cell,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,c,r:1.5+Math.random()*3})}}
function applyState(s){
  prevB={};if(cur)cur.pl.forEach(p=>prevB[p.s]=p.b);cur=s;recv=performance.now();
  s.ev.forEach(([x,y,k])=>{if(k===1){burst(x,y,'#ffb23e',18);beep(520,.1,'triangle',.07,880)}else{burst(x,y,'#e8532a',30);beep(220,.35,'sawtooth',.06,70)}});
  $('sb').innerHTML='';
  s.pl.forEach(p=>{const d=document.createElement('div');d.className='pill'+(s.st==='play'&&!p.a?' dead':'');
    d.innerHTML=`<i style="background:${COL[p.s]}"></i><span>${esc(p.n)}${p.s===mySlot?' (ti)':''}</span><b>${p.sc}</b>`;$('sb').appendChild(d)});
  const ov=$('ov'),go=$('go'),me=role==='host';
  if(s.st==='wait'||s.st==='end'){ov.hidden=false;
    $('t').textContent=s.st==='end'?s.msg:'Čakalnica';
    $('m').innerHTML=s.st==='end'?'Rezultati so seštevni čez runde.':(me?`Povabi prijatelje – soba »${esc(hosting.name)}« je vidna v lobbyju.<br>${s.pl.length}/${MAX} igralcev`:`Čakamo, da gostitelj začne igro.<br>${s.pl.length}/${MAX} igralcev`);
    go.hidden=!me;go.textContent=s.st==='end'?'Nova runda':'Začni igro'}
  else ov.hidden=true;
}

// ---- risanje ----
function orb(px,py,r,now){const p=1+Math.sin(now/180)*.1;let g=ctx.createRadialGradient(px,py,0,px,py,r*2.4*p);g.addColorStop(0,'#ffc23eaa');g.addColorStop(1,'#ffc23e00');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(px,py,r*2.4*p,0,6.283);ctx.fill();
  g=ctx.createRadialGradient(px-r*.3,py-r*.3,0,px,py,r*p);g.addColorStop(0,'#fff');g.addColorStop(.25,'#ffc23e');g.addColorStop(1,'#e8532a');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(px,py,r*p,0,6.283);ctx.fill()}
function pos(pb,cb,i,t){const cx=cb[i*2],cy=cb[i*2+1];if(!pb||!pb.length)return{x:cx,y:cy};const j=Math.min(i,pb.length/2-1),px=pb[j*2],py=pb[j*2+1];
  if(Math.abs(px-cx)>1.5||Math.abs(py-cy)>1.5)return{x:cx,y:cy};return{x:px+(cx-px)*t,y:py+(cy-py)*t}}
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);const dt=Math.min(50,now-last);last=now;
  if(!game2||!cur||!size)return;
  const g=ctx.createLinearGradient(0,0,size,size);g.addColorStop(0,'#1a0f0b');g.addColorStop(1,'#2a1610');ctx.fillStyle=g;ctx.fillRect(0,0,size,size);
  ctx.fillStyle='rgba(255,170,70,.045)';for(let y=0;y<G;y++)for(let x=0;x<G;x++)if((x+y)&1)ctx.fillRect(x*cell,y*cell,cell,cell);
  ctx.strokeStyle='rgba(91,224,255,.3)';ctx.lineWidth=4;ctx.setLineDash([10,8]);ctx.strokeRect(2,2,size-4,size-4);ctx.setLineDash([]);
  for(let i=0;i<cur.f.length;i+=2)orb((cur.f[i]+.5)*cell,(cur.f[i+1]+.5)*cell,cell*.3,now);
  const t=Math.min(1,(now-recv)/STEP);
  cur.pl.forEach(p=>{
    if(!p.a||!p.b.length)return;const n=p.b.length/2,pb=prevB[p.s];
    for(let i=n-1;i>=0;i--){
      const a=pos(pb,p.b,i,t),j=i===0?1:i-1,k=i===0?0:i;
      let dx=p.b[j*2]-p.b[k*2]*1,dy=p.b[j*2+1]-p.b[k*2+1];
      if(i===0){dx=p.b[0]-p.b[2];dy=p.b[1]-p.b[3]}else{dx=p.b[(i-1)*2]-p.b[i*2];dy=p.b[(i-1)*2+1]-p.b[i*2+1]}
      if(dx>1.5)dx-=G;if(dx<-1.5)dx+=G;if(dy>1.5)dy-=G;if(dy<-1.5)dy+=G;
      const s=cell*Math.max(.72,1.16-.4*i/Math.max(n,8));
      ctx.save();ctx.translate((a.x+.5)*cell,(a.y+.5)*cell);ctx.rotate(Math.atan2(dy,dx));
      if(i===0){ctx.shadowColor=COL[p.s];ctx.shadowBlur=cell*.9}
      if(sprites)ctx.drawImage(sprites[p.s],-s/2,-s/2,s,s);else{ctx.fillStyle=COL[p.s];ctx.beginPath();ctx.arc(0,0,s/2,0,6.283);ctx.fill()}
      ctx.restore();
    }
    const h=pos(pb,p.b,0,t);ctx.font='bold 11px sans-serif';ctx.textAlign='center';ctx.lineWidth=3;ctx.strokeStyle='rgba(0,0,0,.7)';
    const lbl=(p.s===mySlot?'▼ ':'')+p.n,ty=Math.max(12,(h.y-.4)*cell);ctx.strokeText(lbl,(h.x+.5)*cell,ty);ctx.fillStyle=COL[p.s];ctx.fillText(lbl,(h.x+.5)*cell,ty);
  });
  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vx*=.96;p.vy*=.96;p.life-=dt/600;if(p.life<=0){particles.splice(i,1);continue}
    ctx.globalAlpha=p.life;ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r*p.life,0,6.283);ctx.fill()}
  ctx.globalAlpha=1;
  if(cur.st==='count'){ctx.font=`bold ${cell*5}px sans-serif`;ctx.textAlign='center';ctx.fillStyle='rgba(255,240,220,.9)';ctx.fillText(cur.cd,size/2,size/2+cell*1.7)}
}
requestAnimationFrame(frame);

// ---- vnos ----
addEventListener('keydown',e=>{
  const M={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]},k=e.key.toLowerCase();
  if(game2&&M[k]){sendMyDir(...M[k]);e.preventDefault()}
  else if(k==='enter'&&game2&&role==='host'&&(H.st==='wait'||H.st==='end'))startRound();
});
let t0=null;
$('wrap').addEventListener('touchstart',e=>{t0=e.touches[0]},{passive:true});
$('wrap').addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
$('wrap').addEventListener('touchend',e=>{if(!t0)return;const t=e.changedTouches[0],dx=t.clientX-t0.clientX,dy=t.clientY-t0.clientY;
  if(Math.max(Math.abs(dx),Math.abs(dy))>16)Math.abs(dx)>Math.abs(dy)?sendMyDir(Math.sign(dx),0):sendMyDir(0,Math.sign(dy));t0=null});
</script>
